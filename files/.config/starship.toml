add_newline = true
command_timeout = 1000
palette = "neon"

# Context goes above the command so a long command can use the whole input line.
format = "$hostname$directory$git_branch$git_commit$git_status$git_state$line_break$status$character"
right_format = "$jobs$python$nodejs$java$golang$rust$docker_context$kubernetes$aws$terraform$cmd_duration"

[hostname]
ssh_only = true
format = "[󰒋 $hostname](bold yellow) "

[directory]
format = "[▌](cyan bg:path_bg)[  $path$read_only ]($style) "
style = "bold cyan bg:path_bg"
read_only = " 󰌾"
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold magenta"
format = "[$symbol$branch]($style) "
truncation_length = 16
only_attached = true

[git_commit]
only_detached = true
format = "[ $hash](bold magenta) "

[git_status]
style = "bold peach"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "~${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_state]
style = "bold yellow"

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[◷ $duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[status]
disabled = false
symbol = "✘"
format = "[$symbol $status]($style) "

[jobs]
symbol = "󰒋"
format = "[$symbol $number]($style) "

[python]
symbol = " "
format = "[$symbol${version}( · $virtualenv)]($style) "

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "

[java]
symbol = " "
format = "[$symbol$version]($style) "

[golang]
symbol = " "
format = "[$symbol$version]($style) "

[rust]
symbol = " "
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "

[kubernetes]
symbol = "󱃾 "
disabled = false
format = "[$symbol$context( \\($namespace\\))]($style) "

[aws]
symbol = " "
format = "[$symbol($profile)(\\($region\\))]($style) "

[terraform]
symbol = "󱁢 "
format = "[$symbol$workspace]($style) "

[palettes.neon]
path_bg = "#06232d"
black = "#000000"
cyan = "#00e5ff"
magenta = "#ff55ff"
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#ff55ff"
red = "#ff4d6a"
maroon = "#eba0ac"
peach = "#ff9933"
yellow = "#ffe600"
green = "#39ff88"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#3399ff"
lavender = "#00e5ff"
text = "#f5f5f5"
subtext1 = "#bac2de"
overlay0 = "#6c7086"
surface0 = "#313244"
base = "#000000"
